[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ezarch"
version = "0.6.0"
description = "Optional tools and infrastructure for architectural drawings, models and visual expression"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "PyYAML>=6.0.2,<7", "pydantic>=2.11,<3", "numpy>=2,<3",
  "shapely>=2.1,<3", "ezdxf==1.4.4", "pymupdf>=1.26,<2",
  "Pillow>=11,<13", "fonttools>=4.59,<5", "resvg-py==0.5.0",
]

[project.optional-dependencies]
model = ["trimesh>=4.9,<6", "rhino3dm==8.35.0", "pycollada>=0.9,<1"]
# Retained only for pre-0.6 projects; no bootstrap profile enables this extra.
legacy-cad = ["cadquery==2.8.0", "vtk>=9.5.1,<10",
  # Newer Numba/llvmlite no longer publish macOS Intel wheels.
  "numba==0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "nlopt==2.9.1; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
ezarch = "ezarch.cli:main"

[tool.hatch.build.targets.wheel]
sources = ["src"]
dev-mode-dirs = ["src"]
only-include = [
  "src/ezarch/_drawing.py",
  "src/ezarch/symbols.py", "src/ezarch/furniture.py",
  "src/ezarch/wall_regions.py", "src/ezarch/vertical_symbols.py",
  "src/ezarch/grids.py",
  "src/ezarch/measurements.py", "src/ezarch/fonts.py",
  "src/ezarch/annotations.py", "src/ezarch/routing.py",
  "src/ezarch/walls.py", "src/ezarch/diagnostics.py",
  "src/ezarch/__init__.py", "src/ezarch/analysis.py", "src/ezarch/assets.py",
  "src/ezarch/audit.py", "src/ezarch/board.py", "src/ezarch/cli.py",
  "src/ezarch/diagrams.py", "src/ezarch/drafting.py", "src/ezarch/environment.py",
  "src/ezarch/exchange.py", "src/ezarch/frames.py", "src/ezarch/geometry.py", "src/ezarch/graphics.py",
  "src/ezarch/intake.py", "src/ezarch/project.py", "src/ezarch/quality.py",
  "src/ezarch/render.py", "src/ezarch/views.py",
  "src/ezarch/cad.py", "src/ezarch/inspection.py", "src/ezarch/rhino.py", "src/ezarch/file_cli.py",
  "src/ezarch/blender.py", "src/ezarch/mesh_views.py",
]

[tool.hatch.build.targets.wheel.force-include]
"assets/drafting/china-conventions.yml" = "ezarch/resources/assets/drafting/china-conventions.yml"
"assets/fonts/COPYING" = "ezarch/resources/assets/fonts/COPYING"
"assets/fonts/README" = "ezarch/resources/assets/fonts/README"
"assets/fonts/SOURCE.md" = "ezarch/resources/assets/fonts/SOURCE.md"
"assets/fonts/FandolFang-Regular.otf" = "ezarch/resources/assets/fonts/FandolFang-Regular.otf"
"assets/fonts/EZarchFang.ttf" = "ezarch/resources/assets/fonts/EZarchFang.ttf"
"THIRD_PARTY_NOTICES.md" = "ezarch/resources/THIRD_PARTY_NOTICES.md"
"scripts/build_font.py" = "ezarch/resources/scripts/build_font.py"
"scripts/blender_scene.py" = "ezarch/resources/scripts/blender_scene.py"
"scripts/blender_verify.py" = "ezarch/resources/scripts/blender_verify.py"
"scripts/blender_inspect.py" = "ezarch/resources/scripts/blender_inspect.py"
"scripts/blender_bridge.py" = "ezarch/resources/scripts/blender_bridge.py"

[tool.hatch.build.hooks.custom]
path = "scripts/build_hooks.py"

[tool.pytest.ini_options]
testpaths = ["../../tests"]

[tool.ruff]
line-length = 110

[tool.uv]
# End-user setup uses prebuilt native dependencies, not a local compiler toolchain.
no-build-package = ["cadquery-ocp", "vtk", "numpy", "scipy", "numba", "llvmlite", "nlopt", "casadi", "rhino3dm", "resvg-py"]
environments = ["sys_platform == 'darwin'", "sys_platform == 'win32'"]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
